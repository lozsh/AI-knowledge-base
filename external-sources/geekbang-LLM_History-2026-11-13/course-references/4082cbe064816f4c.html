      <script type="text/discourse-plugin" version="0.8" nonce="YuTFdNcG7UZCqjsaiGvE74lpO">
  const HIDDEN_CATEGORY_IDS = [23, 24, 25, 26];
  const TARGET_GROUPS = ['trust_level_0']; // Add your group names here

  api.onPageChange(() => {
    const currentUser = api.getCurrentUser();
    if (!currentUser) return;

    const inTargetGroup = currentUser.groups.some(g => TARGET_GROUPS.includes(g.name));
    if (!inTargetGroup) return;

    // Only run inside new topic composer
    const composer = document.querySelector('.composer.new-topic');
    if (!composer) return;

    const interval = setInterval(() => {
      HIDDEN_CATEGORY_IDS.forEach(id => {
        const row = document.querySelector(`.composer.new-topic .select-kit-row[data-value="${id}"]`);
        if (row) row.style.display = 'none';
      });
    }, 300);

    // Clear once loaded
    setTimeout(() => clearInterval(interval), 5000);
  });
</script>

<script type="application/ld+json">{"@context":"http://schema.org","@type":"QAPage","name":"Introducing ChatGPT and Whisper APIs","datePublished":"2023-03-01T18:18:08.427Z","mainEntity":{"@type":"Question","answerCount":18,"author":{"@type":"Person","name":"logankilpatrick","url":"https://community.openai.com/u/logankilpatrick"},"dateModified":"2023-03-01T18:18:08.526Z","datePublished":"2023-03-01T18:18:08.427Z","name":"Introducing ChatGPT and Whisper APIs","text":"Hey all, we are thrilled to share that the ChatGPT API and Whisper API are now available. We also shipped a new data usage guide and focus on stability to make our commitment to developers and customers clear.\n\nRead all the details in our latest blog post: Introducing ChatGPT and Whisper APIs","upvoteCount":39,"suggestedAnswer":[{"@type":"Answer","author":{"@type":"Person","name":"anon10827405","url":"https://community.openai.com/u/anon10827405"},"dateModified":"2023-03-01T18:40:09.778Z","datePublished":"2023-03-01T18:33:05.648Z","text":"Incredible! The price points are great, and I love the direction of structured conversations \u0026 metadata. Great work OpenAI!","upvoteCount":8,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/3"},{"@type":"Answer","author":{"@type":"Person","name":"momchrysti","url":"https://community.openai.com/u/momchrysti"},"dateModified":"2023-03-01T18:34:36.726Z","datePublished":"2023-03-01T18:34:36.715Z","text":"This is great! Any ideas on how we would use embeddings with the new 3.5 version? or Uploading text files to train it on?  the docs seem to indicate that it’s not possible on this model?","upvoteCount":5,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/4"},{"@type":"Answer","author":{"@type":"Person","name":"raymonddavey","url":"https://community.openai.com/u/raymonddavey"},"dateModified":"2023-03-01T18:46:27.477Z","datePublished":"2023-03-01T18:46:27.464Z","text":"This is huge and suddenly make saas offerings cost effective. Can’t wait to try it.","upvoteCount":3,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/5"},{"@type":"Answer","author":{"@type":"Person","name":"stochmal","url":"https://community.openai.com/u/stochmal"},"dateModified":"2023-03-01T18:53:01.118Z","datePublished":"2023-03-01T18:53:01.105Z","text":"changed model from “text-davinci-003” to “gpt-3.5-turbo” and getting error\n\nInvalidRequestError: Invalid URL (POST /v1/completions)\n\nusing Python openai module\n\n“text-davinci-003” works fine?","upvoteCount":0,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/6"},{"@type":"Answer","author":{"@type":"Person","name":"kaviraj008","url":"https://community.openai.com/u/kaviraj008"},"dateModified":"2023-03-01T19:05:02.868Z","datePublished":"2023-03-01T19:05:02.854Z","text":"Used python code from here: OpenAI API\n\nBut getting Error: “AttributeError: module ‘openai’ has no attribute ‘ChatCompletion’”","upvoteCount":2,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/7"},{"@type":"Answer","author":{"@type":"Person","name":"sps","url":"https://community.openai.com/u/sps"},"dateModified":"2023-03-01T19:09:17.332Z","datePublished":"2023-03-01T19:09:17.315Z","text":"Are you using the latest version of the module?","upvoteCount":2,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/8"},{"@type":"Answer","author":{"@type":"Person","name":"sergeliatko","url":"https://community.openai.com/u/sergeliatko"},"dateModified":"2023-03-01T19:12:07.462Z","datePublished":"2023-03-01T19:12:07.451Z","text":"Probably the most exciting news of the Year up to date.","upvoteCount":3,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/9"},{"@type":"Answer","author":{"@type":"Person","name":"PaulBellow","url":"https://community.openai.com/u/PaulBellow"},"dateModified":"2023-03-01T21:33:24.821Z","datePublished":"2023-03-01T19:14:38.477Z","text":"[image] stochmal:\n\nInvalidRequestError: Invalid URL (POST /v1/completions)\n\n‘https://api.openai.com/v1/chat/completions’\n\nGot it working here…\n\n[Screenshot 2023-03-01 at 14-19-53 Character Backstories LitRPG Adventures Workshop]\n\n$messages = array(\n\n(object) [\n\n‘role’ =\u003e ‘system’,\n\n‘content’ =\u003e “description of the chatbot / instructions”\n\n],\n\n(object) [\n\n‘role’ =\u003e ‘user’,\n\n‘content’ =\u003e “user input”\n\n]\n\n);\n\n$payload = array( “messages”=\u003e $messages, “max_tokens”=\u003e 100,“temperature”=\u003e $temp, “top_p”=\u003e $tp, “model”=\u003e $model, “presence_penalty” =\u003e $qq,“frequency_penalty”=\u003e $fp, “n”=\u003e 1, “stream”=\u003e false,  “stop”=\u003e “\u003c|endoftext|\u003e”);\n\n$payload = json_encode($payload);\n\ncurl_setopt($chx, CURLOPT_URL, “https://api.openai.com/v1/chat/completions”);\n\ncurl_setopt($chx, CURLOPT_CUSTOMREQUEST, “POST”);\n\netc etc etc…\n\n[ChatGPT API: AI Character Chat for Pathfinder or DND at LitRPG Adventures (Dev Log Update)]","upvoteCount":2,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/10"},{"@type":"Answer","author":{"@type":"Person","name":"curt.kennedy","url":"https://community.openai.com/u/curt.kennedy"},"dateModified":"2023-03-01T19:20:31.822Z","datePublished":"2023-03-01T19:20:31.811Z","text":"Love it!  My HuggingFace implementation of Whisper went kaput about a week ago, so fell back to AWS Transcribe (which sucks!).  Looking forward to using the API!","upvoteCount":2,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/11"},{"@type":"Answer","author":{"@type":"Person","name":"raymonddavey","url":"https://community.openai.com/u/raymonddavey"},"dateModified":"2023-03-01T19:21:37.132Z","datePublished":"2023-03-01T19:21:37.119Z","text":"I wonder if it is premoderated like Chatgpt. I assume so.","upvoteCount":1,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/12"},{"@type":"Answer","author":{"@type":"Person","name":"PaulBellow","url":"https://community.openai.com/u/PaulBellow"},"dateModified":"2023-03-01T19:26:18.729Z","datePublished":"2023-03-01T19:26:18.567Z","text":"I don’t think so? I’ve got my pre-moderation stuff hooked in, and I think docs say to still use it?\n\nI’m gonna test it with some old TD3 prompts soon… the chat is working great tho…\n\nAnd I’ve got 10,000 stored characters in a database !","upvoteCount":3,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/13"},{"@type":"Answer","author":{"@type":"Person","name":"anon10827405","url":"https://community.openai.com/u/anon10827405"},"dateModified":"2023-03-01T19:27:07.320Z","datePublished":"2023-03-01T19:27:07.304Z","text":"It’s not pre-moderated. I just closed all my tabs but one of the docs specifically mentions at the end that we still need to run it through the moderations endpoint first","upvoteCount":2,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/14"},{"@type":"Answer","author":{"@type":"Person","name":"info.deckly","url":"https://community.openai.com/u/info.deckly"},"dateModified":"2023-03-01T19:47:31.210Z","datePublished":"2023-03-01T19:47:31.196Z","text":"@logankilpatrick\n\n{\n\n\"model\": \"gpt-3.5-turbo\",\n\n\"messages\": [{\"role\": \"user\", \"content\": \"Hello!\"}]\n\n}\n\nI am using this body (the example they have on the documentation) to call ChatGPT API from my web application (bubble.io) but it’s returning\n\n{\n\n\"error\": {\n\n\"message\": \"you must provide a model parameter\",\n\n\"type\": \"invalid_request_error\",\n\n\"param\": null,\n\n\"code\": null\n\n}\n\n}\n\nCan you confirm that the endpoint might not be updated yet?","upvoteCount":0,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/15"},{"@type":"Answer","author":{"@type":"Person","name":"logankilpatrick","url":"https://community.openai.com/u/logankilpatrick"},"dateModified":"2023-03-01T19:56:58.187Z","datePublished":"2023-03-01T19:56:58.174Z","text":"Please share the full code snippet. The client library you are using might be out of date.","upvoteCount":0,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/16"},{"@type":"Answer","author":{"@type":"Person","name":"info.deckly","url":"https://community.openai.com/u/info.deckly"},"dateModified":"2023-03-01T19:59:35.252Z","datePublished":"2023-03-01T19:59:35.235Z","text":"Now it seems to work. It fixed automatically","upvoteCount":0,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/17"},{"@type":"Answer","author":{"@type":"Person","name":"evoknow","url":"https://community.openai.com/u/evoknow"},"dateModified":"2023-03-01T20:23:20.602Z","datePublished":"2023-03-01T20:23:20.586Z","text":"[image] info.deckly:\n\ngpt-3.5-turbo\",\n\nThis is excellent news. One question, we are using “code-davinci-002” for code generation prompts. Will gpt-3.5-turbo have code capabilities, or do we still need to use “code-davinci-002” for code?\n\nThanks,","upvoteCount":1,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/18"},{"@type":"Answer","author":{"@type":"Person","name":"AgusPG","url":"https://community.openai.com/u/AgusPG"},"dateModified":"2023-03-01T20:25:36.132Z","datePublished":"2023-03-01T20:25:36.117Z","text":"This is truly awesome. Congrats to all the team @logankilpatrick. I have been trying it and we’re definitely switching to turbo 3.5, even for non-chat use cases. There are two things I’m particularly amazed by:\n\nA cost reduction of 90% in just three months, with an increasing number of users. Truly fascinating. Suddenly, all our bills are reduced by a factor of 10 while maintaining the same generation quality.\n\nThe new ChatML language. It’s very clever to defend against prompt injection. And it makes way more sense from a conversational point of view. We still need to manage state and sessions on our end, but I was expecting that.\n\nYou guys rock. No wonder why everybody is so thrilled with you.","upvoteCount":2,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/19"},{"@type":"Answer","author":{"@type":"Person","name":"anon10827405","url":"https://community.openai.com/u/anon10827405"},"dateModified":"2023-03-01T20:43:24.276Z","datePublished":"2023-03-01T20:31:41.056Z","text":"I’m curious regarding the metadata and roles. I’m assuming the ChatML documentation isn’t exactly useable yet as I cannot change roles or add metadata.\n\nWill there be a possibility for dynamic roles? For example, if GPT notices a question, it can set the role as QUERY for the back-end server to pick up and process. As of now it seems that we can set one of 3 roles, and that’s it.\n\nOr is this all part of a future update regarding metadata? It does seem like ChatML is for preventing third-party prompt injection, however I’m a bit sad that I can’t “prime” an answer using partial completion.\n\nTo add, as of now I am making GPT prefix the response with a keyword and unique separator for my server to grab and perform logic on as such:\n\n{“role”: “user”, “content”: “Hi. My question is: When was the ChatGPT API released?”},\n\n{“role”: “assistant”, “content”: “QUERY|Can you provide information about the release date of ChatGPT API?”},\n\nWhich QUERY| is caught by my server, and outputs the results as a system message\n\n{“role”: “system”, “content”: “ChatGPT API was released March 1, 2023”}\n\nObviously this still opens me up for injection methods.\n\nI’m assuming this will be applicable in the future with metadata?","upvoteCount":0,"url":"https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/20"}]}}</script>

data-username=\\\"info.deckly\\\" data-post=\\\"15\\\" data-topic=\\\"80485\\\"\\u003e\\n\\u003cdiv class=\\\"title\\\"\\u003e\\n\\u003cdiv class=\\\"quote-controls\\\"\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\"lazy\\\" alt=\\\"\\\" width=\\\"24\\\" height=\\\"24\\\" src=\\\"https://sea2.discourse-cdn.com/openai1/user_avatar/community.openai.com/info.deckly/48/13996_2.png\\\" class=\\\"avatar\\\"\\u003e info.deckly:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003egpt-3.5-turbo\\\",\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThis is excellent news. One question, we are using “code-davinci-002” for code generation prompts. Will gpt-3.5-turbo have code capabilities, or do we still need to use “code-davinci-002” for code?\\u003c/p\\u003e\\n\\u003cp\\u003eThanks,\\u003c/p\\u003e\",\"post_number\":18,\"post_type\":1,\"posts_count\":76,\"updated_at\":\"2023-03-01T20:23:20.586Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":1,\"incoming_link_count\":5,\"reads\":379,\"readers_count\":378,\"score\":115.8,\"yours\":false,\"topic_id\":80485,\"topic_slug\":\"introducing-chatgpt-and-whisper-apis\",\"display_username\":\"EVOKNOW\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":23319,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"mentioned_users\":[],\"post_url\":\"/t/introducing-chatgpt-and-whisper-apis/80485/18\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":127601,\"name\":\"Agustinpinedagarcia\",\"username\":\"AgusPG\",\"avatar_template\":\"/user_avatar/community.openai.com/aguspg/{size}/41789_2.png\",\"created_at\":\"2023-03-01T20:25:36.117Z\",\"cooked\":\"\\u003cp\\u003eThis is truly awesome. Congrats to all the team \\u003ca class=\\\"mention\\\" href=\\\"/u/logankilpatrick\\\"\\u003e@logankilpatrick\\u003c/a\\u003e. I have been trying it and we’re definitely switching to turbo 3.5, even for non-chat use cases. There are two things I’m particularly amazed by:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eA cost reduction of 90% in just three months, with an increasing number of users. Truly fascinating. Suddenly, all our bills are reduced by a factor of 10 while maintaining the same generation quality.\\u003c/li\\u003e\\n\\u003cli\\u003eThe new ChatML language. It’s very clever to defend against prompt injection. And it makes way more sense from a conversational point of view. We still need to manage state and sessions on our end, but I was expecting that.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eYou guys rock. No wonder why everybody is so thrilled with you.\\u003c/p\\u003e\",\"post_number\":19,\"post_type\":1,\"posts_count\":76,\"updated_at\":\"2023-03-01T20:25:36.117Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":10,\"reads\":385,\"readers_count\":384,\"score\":157.0,\"yours\":false,\"topic_id\":80485,\"topic_slug\":\"introducing-chatgpt-and-whisper-apis\",\"display_username\":\"Agustinpinedagarcia\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":\"\",\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":2}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":13734,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"mentioned_users\":[{\"id\":16009,\"username\":\"logankilpatrick\",\"name\":\"Logan Kilpatrick\",\"avatar_template\":\"/user_avatar/community.openai.com/logankilpatrick/{size}/14116_2.png\"}],\"post_url\":\"/t/introducing-chatgpt-and-whisper-apis/80485/19\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":2}],\"current_user_reaction\":null,\"reaction_users_count\":2,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":127611,\"name\":null,\"username\":\"anon10827405\",\"avatar_template\":\"https://avatars.discourse-cdn.com/v4/letter/a/ed8c4c/{size}.png\",\"created_at\":\"2023-03-01T20:31:41.056Z\",\"cooked\":\"\\u003cp\\u003eI’m curious regarding the metadata and roles. I’m assuming the ChatML documentation isn’t exactly useable yet as I cannot change roles or add metadata.\\u003c/p\\u003e\\n\\u003cp\\u003eWill there be a possibility for dynamic roles? For example, if GPT notices a question, it can set the role as QUERY for the back-end server to pick up and process. As of now it seems that we can set one of 3 roles, and that’s it.\\u003c/p\\u003e\\n\\u003cp\\u003eOr is this all part of a future update regarding metadata? It does seem like ChatML is for preventing third-party prompt injection, however I’m a bit sad that I can’t “prime” an answer using partial completion.\\u003c/p\\u003e\\n\\u003cp\\u003eTo add, as of now I am making GPT prefix the response with a keyword and unique separator for my server to grab and perform logic on as such:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e{“role”: “user”, “content”: “Hi. My question is: When was the ChatGPT API released?”},\\u003cbr\\u003e\\n{“role”: “assistant”, “content”: “QUERY|Can you provide information about the release date of ChatGPT API?”},\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eWhich QUERY| is caught by my server, and outputs the results as a system message\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e{“role”: “system”, “content”: “ChatGPT API was released March 1, 2023”}\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eObviously this still opens me up for injection methods.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m assuming this will be applicable in the future with metadata?\\u003c/p\\u003e\",\"post_number\":20,\"post_type\":1,\"posts_count\":76,\"updated_at\":\"2023-03-01T20:44:09.244Z\",\"reply_count\":0,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":5,\"reads\":378,\"readers_count\":377,\"score\":100.6,\"yours\":false,\"topic_id\":80485,\"topic_slug\":\"introducing-chatgpt-and-whisper-apis\",\"display_username\":null,\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":3,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":55593,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"mentioned_users\":[],\"post_url\":\"/t/introducing-chatgpt-and-whisper-apis/80485/20\",\"reactions\":[],\"current_user_reaction\":null,\"reaction_users_count\":0,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\" <p>This is excellent news. One question, we are using “code-davinci-002” for code generation prompts. Will gpt-3.5-turbo have code capabilities, or do we still need to use “code-davinci-002” for code?</p>

          <div id='post_19' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2023-03-01T20:25:36Z' class='post-time'>

              <span itemprop="position">19</span>
              </span>

            <div class='post' itemprop="text">
              <p>This is truly awesome. Congrats to all the team <a class="mention" href="/u/logankilpatrick">@logankilpatrick</a>. I have been trying it and we’re definitely switching to turbo 3.5, even for non-chat use cases. There are two things I’m particularly amazed by:</p>
<ul>
<li>A cost reduction of 90% in just three months, with an increasing number of users. Truly fascinating. Suddenly, all our bills are reduced by a factor of 10 while maintaining the same generation quality.</li>
<li>The new ChatML language. It’s very clever to defend against prompt injection. And it makes way more sense from a conversational point of view. We still need to manage state and sessions on our end, but I was expecting that.</li>
</ul>
<p>You guys rock. No wonder why everybody is so thrilled with you.</p>
            </div>



            

<meta itemprop='upvoteCount' content='2'><meta itemprop='url' content='https://community.openai.com/t/introducing-chatgpt-and-whisper-apis/80485/19'>

          <div id='post_20' itemprop="suggestedAnswer" itemscope="itemscope" itemtype="https://schema.org/Answer" class='topic-body crawler-post'>

              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://community.openai.com/u/anon10827405'><span itemprop="name">anon10827405</span></a>
                  <meta itemprop='url' content='https://community.openai.com/u/anon10827405'>
                
              </span>



              <span class="crawler-post-infos">

                  <meta itemprop='dateModified' content='2023-03-01T20:43:24Z'>
              <span itemprop="position">20</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>I’m curious regarding the metadata and roles. I’m assuming the ChatML documentation isn’t exactly useable yet as I cannot change roles or add metadata.</p>
<p>Will there be a possibility for dynamic roles? For example, if GPT notices a question, it can set the role as QUERY for the back-end server to pick up and process. As of now it seems that we can set one of 3 roles, and that’s it.</p>
<p>Or is this all part of a future update regarding metadata? It does seem like ChatML is for preventing third-party prompt injection, however I’m a bit sad that I can’t “prime” an answer using partial completion.</p>
<p>To add, as of now I am making GPT prefix the response with a keyword and unique separator for my server to grab and perform logic on as such:</p>
<blockquote>
<p>{“role”: “user”, “content”: “Hi. My question is: When was the ChatGPT API released?”},<br>
{“role”: “assistant”, “content”: “QUERY|Can you provide information about the release date of ChatGPT API?”},</p>
</blockquote>
<p>Which QUERY| is caught by my server, and outputs the results as a system message</p>
<blockquote>
<p>{“role”: “system”, “content”: “ChatGPT API was released March 1, 2023”}</p>
</blockquote>
<p>Obviously this still opens me up for injection methods.</p>
<p>I’m assuming this will be applicable in the future with metadata?</p>
            </div>
