site_name: AI 知识库
site_description: 24 个主题域的 AI 自学知识库——公开课程与教材资料提炼整理
site_url: https://lozsh.github.io/AI-knowledge-base/

docs_dir: AI知识库
site_dir: site

theme:
  name: material
  language: zh
  font: false
  palette:
    scheme: default
  features:
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/site.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - hooks.py

plugins:
  - search:
      lang: zh

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: false
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
