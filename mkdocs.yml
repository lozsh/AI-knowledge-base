site_name: AI 知识库
site_description: 24 个主题域的 AI 自学知识库——公开课程与教材资料提炼整理
site_url: https://lozsh.github.io/AI-knowledge-base/

docs_dir: AI知识库
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换到浅色

plugins:
  - search:
      lang: zh

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite
